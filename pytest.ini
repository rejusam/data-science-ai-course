[pytest]
# The teaching demo under modules/01a-programming-fundamentals/pytest-demo ships
# with a deliberate bug for students to find, so a bare `pytest` from the
# repository root must not collect it. Run that one from inside its own folder:
#
#     cd modules/01a-programming-fundamentals/pytest-demo
#     pytest
#
# Excluded by name rather than by pointing `testpaths` at the course tooling.
# The tooling is not published, so on a student's clone `testpaths` would name a
# directory that does not exist -- and pytest does not fail on that. It warns,
# falls back to collecting from the root, and picks up the deliberately broken
# demo, which is the one thing this file exists to prevent.
norecursedirs = pytest-demo
