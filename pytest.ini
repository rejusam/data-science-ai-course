[pytest]
# Bare `pytest` from the repository root runs the tests for the course tooling
# only. The teaching demo under modules/01a-programming-fundamentals/pytest-demo
# ships with a deliberate bug for students to find, so it is not collected from
# here. Run it from inside its own folder:
#
#     cd modules/01a-programming-fundamentals/pytest-demo
#     pytest
testpaths = tools/tests
